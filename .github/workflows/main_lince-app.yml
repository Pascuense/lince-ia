name: Build and deploy Node.js app to Azure Web App - lince-app

on:
  workflow_dispatch:
  push:
    branches:
      - claude/check-element-visibility-ea809

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Install and build
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Prepare deploy package in dist
        run: |
          cp package.json dist/
          cp package-lock.json dist/
          node scripts/prepare-deploy-package.mjs dist/package.json
          cd dist && npm install --omit=dev --legacy-peer-deps

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Both deploy workflows target the same lince-app slot; never run two at once
    concurrency:
      group: deploy-lince-app
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lince-app"
          slot-name: "Production"
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C33591B88D5B4BB7B54DC0945C555A20 }}
