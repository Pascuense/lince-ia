name: Android — Build & Release (Play Store)

on:
  # Se dispara manualmente desde GitHub Actions con un número de versión
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión de la app (ej: 3.1.0)"
        required: true
        default: "3.0.0"
      version_code:
        description: "Código de versión entero incremental (ej: 10)"
        required: true
        default: "1"
      track:
        description: "Track de Play Store"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-android:
    name: Build AAB firmado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Vite)
        run: npm run build:web
        env:
          # Variables de entorno necesarias para el build del cliente
          VITE_APP_TITLE: "LINCE - Aprende IA Jugando"
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Sincronizar Capacitor (Android)
        run: npx cap sync android

      - name: Actualizar versión en build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > lince-release.keystore

      - name: Build AAB de producción
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/lince-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEYSTORE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_KEY_PASSWORD }}"

      - name: Subir AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: lince-v${{ github.event.inputs.version_name }}-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publicar en Google Play (opcional)
        # Descomenta este step cuando tengas la clave de servicio de Google Play API
        # uses: r0adkll/upload-google-play@v1
        # with:
        #   serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        #   packageName: app.lince.ia
        #   releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
        #   track: ${{ github.event.inputs.track }}
        #   status: completed
        run: echo "✅ AAB listo. Súbelo manualmente en https://play.google.com/console"

      - name: Limpiar Keystore
        if: always()
        run: rm -f lince-release.keystore
