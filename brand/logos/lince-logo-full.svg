<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- LINCE Logo Full — Dark Mode Version -->
  <!-- Placeholder: Replace with final brand asset from design team -->
  <!-- See brand/guidelines/LOGO_ASSETS.md for specifications -->

  <!-- Isotipo: Lince estilizado -->
  <g transform="translate(0, 5)">
    <!-- Cabeza del lince (forma simplificada) -->
    <circle cx="20" cy="20" r="16" fill="#00E5FF" opacity="0.15"/>
    <!-- Orejas puntiagudas (rasgo distintivo del lince) -->
    <polygon points="10,8 14,16 6,16" fill="#00E5FF"/>
    <polygon points="30,8 34,16 26,16" fill="#00E5FF"/>
    <!-- Cara -->
    <circle cx="20" cy="22" r="12" fill="#0A0A0A" stroke="#00E5FF" stroke-width="1.5"/>
    <!-- Ojos (mandorla - forma de almendra, evoca visión aguda) -->
    <ellipse cx="16" cy="21" rx="3" ry="2" fill="#00E5FF"/>
    <ellipse cx="24" cy="21" rx="3" ry="2" fill="#00E5FF"/>
    <!-- Pupilas -->
    <ellipse cx="16" cy="21" rx="1.5" ry="1.8" fill="#0A0A0A"/>
    <ellipse cx="24" cy="21" rx="1.5" ry="1.8" fill="#0A0A0A"/>
    <!-- Brillo ocular -->
    <circle cx="17" cy="20" r="0.6" fill="#FFFFFF"/>
    <circle cx="25" cy="20" r="0.6" fill="#FFFFFF"/>
    <!-- Bigotes -->
    <line x1="8" y1="25" x2="14" y2="24" stroke="#00E5FF" stroke-width="0.8" opacity="0.7"/>
    <line x1="8" y1="27" x2="14" y2="26" stroke="#00E5FF" stroke-width="0.8" opacity="0.7"/>
    <line x1="26" y1="24" x2="32" y2="25" stroke="#00E5FF" stroke-width="0.8" opacity="0.7"/>
    <line x1="26" y1="26" x2="32" y2="27" stroke="#00E5FF" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Logotipo: Wordmark "LINCE" -->
  <text x="48" y="33" font-family="Inter, -apple-system, sans-serif"
        font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">
    LINCE
  </text>
</svg>
