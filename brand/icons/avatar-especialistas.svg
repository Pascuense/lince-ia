<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!--
    LINCE Avatar — Especialistas
    Versión 2.0.0 | ACNB IA SL
    Color primario: #1565C0
    
    PLACEHOLDER: Este es un avatar de marcador hasta la entrega
    del asset final del equipo de diseño.
    Ver brand/guidelines/UI_COMPONENTS.md#avatares para especificaciones.
  -->

  <!-- Fondo circular -->
  <circle cx="64" cy="64" r="60" fill="#1565C0" opacity="0.15"/>
  <circle cx="64" cy="64" r="56" fill="#1A1A1A" stroke="#1565C0" stroke-width="2"/>

  <!-- Cuerpo del avatar (placeholder geométrico) -->
  <!-- Cabeza -->
  <circle cx="64" cy="48" r="22" fill="#242424" stroke="#1565C0" stroke-width="1.5"/>
  
  <!-- Cara con iniciales del avatar -->
  <text x="64" y="55" text-anchor="middle" 
        font-family="Inter, sans-serif" font-weight="800" font-size="20"
        fill="#1565C0">ESP</text>

  <!-- Cuerpo (silueta) -->
  <ellipse cx="64" cy="96" rx="28" ry="20" fill="#242424" stroke="#1565C0" 
           stroke-width="1.5" opacity="0.8"/>

  <!-- Nombre del avatar -->
  <text x="64" y="122" text-anchor="middle"
        font-family="Inter, sans-serif" font-weight="600" font-size="9"
        fill="#1565C0" opacity="0.8">Especialistas</text>

  <!-- Indicador de estado (punto de disponibilidad) -->
  <circle cx="90" cy="90" r="7" fill="#0A0A0A"/>
  <circle cx="90" cy="90" r="5" fill="#00D084"/>
</svg>
