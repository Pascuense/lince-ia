<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!--
    LINCE — UI Icons Set
    Versión 2.0.0 | ACNB IA SL

    Iconos de interfaz de usuario en estilo outline (Lucide-compatible).
    Uso: color="currentColor", tamaños: 16, 20, 24, 32, 48px

    La librería primaria es Lucide React (ya instalada en el proyecto).
    Este archivo contiene los iconos custom específicos de LINCE.
  -->

  <!-- Home / Inicio (24x24) -->
  <g transform="translate(20, 20)">
    <title>Inicio</title>
    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
    <polyline points="9 22 9 12 15 12 15 22"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">home</text>
  </g>

  <!-- AI Chip / IA (24x24) -->
  <g transform="translate(80, 20)">
    <title>Inteligencia Artificial</title>
    <rect x="4" y="4" width="16" height="16" rx="2"/>
    <rect x="9" y="9" width="6" height="6"/>
    <line x1="9" y1="1" x2="9" y2="4"/>
    <line x1="15" y1="1" x2="15" y2="4"/>
    <line x1="9" y1="20" x2="9" y2="23"/>
    <line x1="15" y1="20" x2="15" y2="23"/>
    <line x1="20" y1="9" x2="23" y2="9"/>
    <line x1="20" y1="15" x2="23" y2="15"/>
    <line x1="1" y1="9" x2="4" y2="9"/>
    <line x1="1" y1="15" x2="4" y2="15"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">ai-chip</text>
  </g>

  <!-- Gamepad / Juego (24x24) -->
  <g transform="translate(140, 20)">
    <title>Juego / Gamificación</title>
    <rect x="2" y="6" width="20" height="12" rx="6"/>
    <circle cx="9" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    <path d="M15 10v4M13 12h4"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">game</text>
  </g>

  <!-- Star / Favorito (24x24) -->
  <g transform="translate(200, 20)">
    <title>Favorito / Destacado</title>
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">star</text>
  </g>

  <!-- Award / Logro (24x24) -->
  <g transform="translate(260, 20)">
    <title>Logro / Premio</title>
    <circle cx="12" cy="8" r="6"/>
    <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">award</text>
  </g>

  <!-- Zap / XP (24x24) -->
  <g transform="translate(320, 20)">
    <title>XP / Energía</title>
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">xp</text>
  </g>

  <!-- Flame / Racha (24x24) -->
  <g transform="translate(380, 20)">
    <title>Racha de días</title>
    <path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 3z"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">streak</text>
  </g>

  <!-- Book / Academia (24x24) -->
  <g transform="translate(20, 90)">
    <title>Academia / Curso</title>
    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">book</text>
  </g>

  <!-- Users / Comunidad (24x24) -->
  <g transform="translate(80, 90)">
    <title>Comunidad / Usuarios</title>
    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 00-3-3.87"/>
    <path d="M16 3.13a4 4 0 010 7.75"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">users</text>
  </g>

  <!-- Settings / Configuración (24x24) -->
  <g transform="translate(140, 90)">
    <title>Configuración</title>
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">settings</text>
  </g>

  <!-- Bell / Notificación (24x24) -->
  <g transform="translate(200, 90)">
    <title>Notificación</title>
    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 01-3.46 0"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">bell</text>
  </g>

  <!-- Wand / Prompt Studio (24x24) -->
  <g transform="translate(260, 90)">
    <title>Prompt Studio / Magia IA</title>
    <path d="M15 4V2M15 16v-2M8 9H2M14 9h6M17.8 11.8L19 13M15 9h.01M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">wand</text>
  </g>

  <!-- Chat / Avatar Chat (24x24) -->
  <g transform="translate(320, 90)">
    <title>Chat con Avatar</title>
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">chat</text>
  </g>

  <!-- Lock / Bloqueado (24x24) -->
  <g transform="translate(380, 90)">
    <title>Bloqueado / Candado</title>
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0110 0v4"/>
    <text x="12" y="38" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="8" fill="#707070" stroke="none">lock</text>
  </g>
</svg>
